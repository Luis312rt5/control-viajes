# Blueprint de Render para desplegar los 3 servicios del backend
# de un solo golpe ("New +" -> "Blueprint" en el dashboard de Render,
# apuntando a este repositorio).
#
# BASE DE DATOS: este blueprint YA NO crea una base Postgres nueva (el plan
# free de Render solo permite una base activa por cuenta). En cambio,
# trips-service y operations-service reciben la conexión vía la variable
# DATABASE_URL, que hay que completar a mano con la "Internal Database URL"
# de tu base Postgres existente en Render (dashboard -> tu base -> "Connect"
# -> "Internal Database URL"; usa la interna, no la externa, para que el
# tráfico no salga a internet). Ambos servicios crean sus tablas dentro del
# esquema "viajes" (no "public"), así que pueden compartir esa base con
# cualquier otro proyecto sin choque de nombres de tabla — no hace falta
# revisar qué tablas tiene el otro proyecto.
#
# IMPORTANTE — pasos manuales después del primer deploy (Render todavía no
# asigna las URLs públicas antes de crear los servicios, así que no se
# pueden auto-cablear de antemano):
#   1. En "trips-service" y "operations-service", pestaña "Environment",
#      completa DATABASE_URL con la Internal Database URL de tu Postgres.
#   2. Copia la URL pública que Render asignó a "trips-service"
#      (algo como https://trips-service-xxxx.onrender.com) y pégala, con
#      /internal al final, como valor de TRIPS_SERVICE_URL en las variables
#      de entorno de "operations-service" y de "gateway".
#   3. Copia la URL pública de "operations-service" + /internal como valor
#      de OPERATIONS_SERVICE_URL en "gateway".
#   4. Copia la URL pública de "gateway" + /api como valor de VITE_API_URL
#      en el proyecto de Vercel del frontend (ver frontend/.env.example).
#   5. En cada uno de los 3 servicios, en la pestaña "Settings" -> "Health
#      Checks", confirma que el Health Check Path sea /health (ya viene
#      seteado por este blueprint).
#
# Nota sobre el plan Free: los servicios se "duermen" tras 15 min sin
# tráfico (ver README). Para un despliegue permanente/productivo, cambia
# `plan: free` por `plan: starter` en los 3 servicios.

services:
  - type: web
    name: trips-service
    runtime: docker
    plan: free
    dockerfilePath: backend/trips-service/Dockerfile
    dockerContext: backend/trips-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false # pega aquí la Internal Database URL de tu Postgres, ver instrucciones arriba
      - key: DB_SCHEMA
        value: viajes
      - key: INTERNAL_API_KEY
        generateValue: true

  - type: web
    name: operations-service
    runtime: docker
    plan: free
    dockerfilePath: backend/operations-service/Dockerfile
    dockerContext: backend/operations-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        sync: false # pega aquí la Internal Database URL de tu Postgres, ver instrucciones arriba
      - key: DB_SCHEMA
        value: viajes
      - key: INTERNAL_API_KEY
        fromService:
          type: web
          name: trips-service
          envVarKey: INTERNAL_API_KEY
      - key: TRIPS_SERVICE_URL
        sync: false # completar manualmente, ver instrucciones arriba

  - type: web
    name: gateway
    runtime: docker
    plan: free
    dockerfilePath: backend/gateway/Dockerfile
    dockerContext: backend/gateway
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        fromService:
          type: web
          name: trips-service
          envVarKey: INTERNAL_API_KEY
      - key: TRIPS_SERVICE_URL
        sync: false # completar manualmente, ver instrucciones arriba
      - key: OPERATIONS_SERVICE_URL
        sync: false # completar manualmente, ver instrucciones arriba
